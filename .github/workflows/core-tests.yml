name: Testes do livro
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Persistência e narrativa
        run: dotnet run --project Desenvolvimento/CoreTests.csproj
      - name: Séculos, nomes e contexto
        run: dotnet run --project Desenvolvimento/CenturyTests.csproj
